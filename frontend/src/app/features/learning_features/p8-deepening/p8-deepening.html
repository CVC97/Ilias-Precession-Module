<div class="container">
    <div class="card">
        @if (currentView === 'deepening1') {
            <h1>Vertiefung (1/2)</h1>
            <p class="page-subheadline">Freies Experimentieren</p>
        } @else {
            <h1>Vertiefung (2/2)</h1>
            <p class="page-subheadline">Kreisel im Kosmos</p>
        }

        <!-- Content sections -->
        <div class="content">
            @if (currentView === 'deepening1') {
                <div>
                    <p [innerHTML]="deepeningText1a"></p>

                    <app-sim-embed presetId="free-lab"></app-sim-embed>
                </div>
            }

            @if (currentView === 'deepening2') {
                <!-- placeholder text; the matching task (images ↔ concepts) follows later -->
                <div>
                    <div [innerHTML]="deepeningText2a"></div>
                </div>
            }
        </div>

        <!-- navigation buttons -->
        <div class="button-container">
            @if (isFirstPage) {
                @if (devMode.isEnabled) {
                    <button class="btn btn-back" (click)="goBack()">← Zurück zur Messstrategie</button>
                }
            } @else {
                <button class="btn btn-back" (click)="goBack()">← Zurück</button>
            }

            @if (isLastPage) {
                <button class="btn" (click)="goForward()">Weiter zum Abschluss →</button>
            } @else {
                <button class="btn" (click)="goForward()">Weiter →</button>
            }
        </div>
    </div>
</div>
