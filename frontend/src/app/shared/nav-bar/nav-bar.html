@if (drawer.isOpen()) {
    <div class="nav-backdrop" (click)="drawer.close()"></div>
}
<nav class="nav-bar" id="app-nav" [class.nav-bar--open]="drawer.isOpen()">
    <div class="nav-bar-container">

        <!-- Startseite -->
        <button class="nav-endpoint-btn"
            [class.nav-endpoint-active]="activeSegment === 'home'"
            [class.nav-endpoint-btn-dev]="isHomeClickable"
            [class.nav-endpoint-dev]="isHomeClickable"
            (click)="goHome()">
            Startseite
        </button>
        @if (devMode.isEnabled) {
        <!-- Glossary access in dev-mode -->
        <button class="nav-endpoint-btn"
            [class.nav-endpoint-active]="activeSegment === 'glossary'"
            [class.nav-endpoint-btn-dev]="devMode.isEnabled"
            [class.nav-endpoint-dev]="devMode.isEnabled"
            (click)="goGlossary()">
            Glossar
        </button>   
        }

        <!-- Learning path -->
        <div class="strand-section">

            <div class="strand-switcher">
                <div class="strand-tab strand-tab-active">Lernweg</div>
            </div>

            <div class="strand-col">
                @for (seg of segments; track seg.id) {
                    <ng-container *ngTemplateOutlet="segmentBlock; context: { $implicit: seg }"></ng-container>
                }
            </div>
        </div>

        <!-- Abschluss (target page) -->
        <button class="nav-endpoint-btn"
            [class.nav-endpoint-active]="activeSegment === 'target'"
            [class.nav-endpoint-btn-dev]="isTargetClickable"
            [class.nav-endpoint-dev]="isTargetClickable"
            (click)="goTarget()">
            Abschluss
        </button>

    </div>
</nav>

<ng-template #segmentBlock let-seg>
    <button class="seg-btn"
        [class.seg-btn-dev]="canOpenSegment(seg)"
        [ngClass]="getSegmentClass(seg)"
        (click)="onSegmentClick(seg)">
        {{ seg.label }}
    </button>
    @if (activeSegment === seg.id) {
        <div class="seg-dropdown">
            @for (sub of seg.subpages; track sub.route + (sub.queryParams?.['page'] ?? '')) {
                <button class="sub-btn"
                    [class.sub-btn-dev]="canOpen(sub)"
                    [class.sub-btn-active]="isSubpageActive(sub)"
                    (click)="navigateToSubpage(sub)">
                    {{ sub.label }}
                </button>
            }
        </div>
    }
</ng-template>
