<div class="evaluation-container" [class]="containerId" [class.disabled]="isCorrect">
    <div class="evaluation-content">
        <h3 class="evaluation-question" [innerHTML]="question"></h3>
        @if (hasRevisedQuestion) {
            <p role="status">Diese Aufgabe wurde überarbeitet. Ihre frühere Antwort wird nicht auf die neue Fassung übertragen. Bitte bearbeiten Sie die Aufgabe erneut.</p>
        }

        <div class="evaluation-options">
            @for (option of shuffledOptions; track option.value) {
                <label class="evaluation-option" [class.selected]="selectedValue === option.value">
                    <input
                        type="radio"
                        [name]="containerId"
                        [value]="option.value"
                        [disabled]="isCorrect"
                        (change)="selectionChanged(option.value)">
                    <span>{{ option.label }}</span>
                </label>
            }
        </div>

        <button class="eval-btn evaluation-submit-btn" (click)="evaluateAnswer()" [disabled]="isCorrect">
            Auswerten
        </button>

        <div class="evaluation-result"
             [class.show]="showResult"
             [class.correct]="isCorrect"
             [class.incorrect]="!isCorrect">
            <p [innerHTML]="resultMessage"></p>
        </div>
    </div>
</div>
