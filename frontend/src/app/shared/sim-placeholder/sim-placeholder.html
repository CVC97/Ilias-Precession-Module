<div class="sim-placeholder">
    <div class="sim-placeholder-inner">
        <img class="sim-placeholder-icon" src="assets/icons/precession_icon.svg" alt="">
        <p class="sim-placeholder-title">3D-Simulation des Kreisels</p>
        <p class="sim-placeholder-text">Die interaktive Simulation wird an dieser Stelle eingebunden.</p>

        @if (devMode.isEnabled && preset) {
            <dl class="sim-placeholder-dev">
                <dt>Preset</dt><dd>{{ preset.id }}: {{ preset.description }}</dd>
                <dt>Settings</dt><dd>{{ settingsText }}</dd>
                <dt>Controls</dt><dd>{{ preset.controls.join(', ') }}</dd>
                @if (preset.gate) {
                    <dt>Gate</dt><dd>{{ preset.gate }}</dd>
                }
            </dl>
        }
    </div>
</div>
