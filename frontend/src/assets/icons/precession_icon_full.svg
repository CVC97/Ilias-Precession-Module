<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Outer ring -->
    <circle cx="50" cy="50" r="43" fill="none" stroke="rgb(80, 165, 210)" stroke-width="12"/>

    <!-- Inner ring -->
    <circle cx="50" cy="50" r="32" fill="none" stroke="white" stroke-width="7"/>

    <!-- Gyroscope disk -->
    <ellipse cx="50" cy="58" rx="27" ry="11" fill="none" stroke="white" stroke-width="7" transform="rotate(12 50 58)"/>

    <!-- Gyroscope axle -->
    <line x1="50" y1="25" x2="50" y2="82" stroke="white" stroke-width="6" stroke-linecap="round"/>

    <!-- Central hub -->
    <circle cx="50" cy="57" r="7" fill="rgb(80, 165, 210)" stroke="white" stroke-width="4"/>

    <!-- Top axle cap -->
    <circle cx="50" cy="27" r="5" fill="white"/>

    <!-- Precession / rotation path -->
    <path d="M 27 38 C 35 27, 57 23, 72 30 C 79 33, 83 38, 85 43" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 5"/>

    <!-- Arrow head indicating precession -->
    <path d="M 81 38 L 87 43 L 79 46 Z" fill="white"/>

</svg>
